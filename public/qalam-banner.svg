<svg width="850" height="280" viewBox="0 0 850 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Warm Golden Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-en {
      font-family: 'Lora', 'Georgia', 'Times New Roman', serif;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .brand-hi {
      font-family: 'Yatra One', 'Rozha One', 'Noto Serif Devanagari', 'Devanagari MT', serif;
      font-weight: 700;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 400;
      letter-spacing: 0.8px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.4px;
    }
  </style>

  <!-- Base Card Frame -->
  <rect width="850" height="280" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect width="850" height="280" rx="16" fill="url(#centerGlow)"/>

  <!-- Decorative Delicate Corner Filigree -->
  <path d="M 28 42 C 28 28, 42 28, 42 28" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <circle cx="28" cy="28" r="2" fill="#f59e0b" opacity="0.8"/>

  <path d="M 822 42 C 822 28, 808 28, 808 28" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <circle cx="822" cy="28" r="2" fill="#f59e0b" opacity="0.8"/>

  <path d="M 28 238 C 28 252, 42 252, 42 252" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <circle cx="28" cy="252" r="2" fill="#f59e0b" opacity="0.8"/>

  <path d="M 822 238 C 822 252, 808 252, 808 252" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <circle cx="822" cy="252" r="2" fill="#f59e0b" opacity="0.8"/>

  <!-- Center Decorative Pen Nib Icon -->
  <g transform="translate(425, 62) scale(1.15)">
    <!-- Subtle Golden halo -->
    <circle cx="0" cy="0" r="26" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>
    <!-- Nib Body -->
    <path d="M 0 -22 L 14 -4 C 15 10, 10 20, 0 25 C -10 20, -15 10, -14 -4 Z" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="0.8"/>
    <!-- Nib Slit & Breather Hole -->
    <line x1="0" y1="-22" x2="0" y2="4" stroke="#0a0c10" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="2.2" fill="#0a0c10"/>
    <!-- Little ink drop -->
    <circle cx="0" cy="-26" r="1.6" fill="#f59e0b" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <g text-anchor="middle">
    <!-- Main Title: Qalam & क़लम -->
    <text x="390" y="148" font-size="52" fill="#ffffff" class="brand-en">Qalam</text>
    <text x="495" y="148" font-size="38" fill="url(#goldGrad)" class="brand-hi">क़लम</text>

    <!-- Subtitle / Philosophy -->
    <text x="425" y="186" font-size="14.5" fill="#94a3b8" class="tagline">
      The Modern Literary Sanctuary for Poetry, Shayari, Ghazals &amp; Verse
    </text>

    <!-- Aesthetic Decorative Divider Line -->
    <path d="M 315 204 L 535 204" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.45"/>
    <circle cx="425" cy="204" r="2.5" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Feature Pills / Tech Badges (Modern & Minimalist) -->
  <g transform="translate(145, 222)">
    <!-- Pill 1: Next.js 16 -->
    <rect x="0" y="0" width="102" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="12" cy="13" r="3.5" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    <text x="56" y="17" fill="#e2e8f0" text-anchor="middle" class="badge-text">Next.js 16</text>

    <!-- Pill 2: Turbopack -->
    <rect x="112" y="0" width="108" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="124" cy="13" r="3.5" fill="#3b82f6"/>
    <text x="172" y="17" fill="#e2e8f0" text-anchor="middle" class="badge-text">Turbopack</text>

    <!-- Pill 3: React 19 -->
    <rect x="230" y="0" width="98" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="242" cy="13" r="3.5" fill="#61dafb"/>
    <text x="285" y="17" fill="#e2e8f0" text-anchor="middle" class="badge-text">React 19</text>

    <!-- Pill 4: Tailwind v4 -->
    <rect x="338" y="0" width="118" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="350" cy="13" r="3.5" fill="#06b6d4"/>
    <text x="403" y="17" fill="#e2e8f0" text-anchor="middle" class="badge-text">Tailwind v4</text>

    <!-- Pill 5: Supabase RLS -->
    <rect x="466" y="0" width="94" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="478" cy="13" r="3.5" fill="#3ecf8e"/>
    <text x="519" y="17" fill="#e2e8f0" text-anchor="middle" class="badge-text">Supabase</text>
  </g>
</svg>
